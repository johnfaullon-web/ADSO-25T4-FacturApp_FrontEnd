
{% extends 'layout.html' %}

{% block content %}
<h1>New Client</h1>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" aria-describedby="emailHelp">
          <div id="nameHelp" class="form-text">Write your full name.</div>
        </div>
        <div class="mb-3">
          <label for="idType" class="form-label">Identification Number</label>
          <select class="form-select" aria-label="idTypeHelp">
            <option selected>Select your identification type</option>
            <option value="CC">CC</option>
            <option value="TI">TI</option>
            <option value="CE">CE</option>
            <option value="PA">PAS</option>
          </select>
          <div id="idTypeHelp" class="form-text">Write your identification number.</div>
        </div>
        <div class="mb-3">
          <label for="idNumber" class="form-label">Identification Number</label>
          <input type="text" class="form-control" id="adress" aria-describedby="idNumberHelp" placeholder="11122333">
          <div id="idNumberHelp" class="form-text">Write your identification number.</div>
        </div>
        <div class="mb-3">
          <label for="adress" class="form-label">Adress</label>
          <input type="text" class="form-control" id="adress" aria-describedby="emailHelp" placeholder="Cra 20 # 55 -66">
          <div id="adressHelp" class="form-text">Write your home adress.</div>
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="recibirEmail">
          <label class="form-check-label" for="exampleCheck1">Do you want be contacted by e-mail?</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
{% endblock %}
